@if (contentService.content(); as content) {
  <app-site-header [profile]="content.profile" />
  <main id="home">
    <app-hero [profile]="content.profile" />
    <app-publications [profile]="content.profile" [publications]="content.publications" />
    <app-projects [projects]="content.projects" />
    <app-cv [timeline]="content.experience" [cvUrl]="content.profile.cvUrl" />
    <app-contact [profile]="content.profile" />
  </main>
  <app-site-footer [profile]="content.profile" />
} @else if (contentService.error(); as error) {
  <div class="content-error" role="alert">
    <h1>Content unavailable</h1>
    <p>{{ error }}</p>
  </div>
} @else {
  <main class="content-loading" aria-live="polite">Loading portfolio…</main>
}
